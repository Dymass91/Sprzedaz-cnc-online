name: Deploy na Cloudflare Pages

# Każdy push na main buduje eksport statyczny i wdraża go na https://vexor-cnc.pages.dev
# Wymagane sekrety repozytorium: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cloudflare-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Sprawdź sekrety
        id: secrets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::Brak sekretów CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID — pomijam deploy."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.secrets.outputs.ready == 'true'

      - uses: actions/setup-node@v4
        if: steps.secrets.outputs.ready == 'true'
        with:
          node-version-file: .node-version
          cache: npm

      - name: Instalacja i build
        if: steps.secrets.outputs.ready == 'true'
        run: |
          npm ci
          npm run lint
          npm run build

      - name: Deploy
        if: steps.secrets.outputs.ready == 'true'
        # Wrangler uruchamiany poza katalogiem projektu, żeby nie próbował go przerabiać pod OpenNext.
        working-directory: ${{ runner.temp }}
        run: npx --yes wrangler@4 pages deploy "$GITHUB_WORKSPACE/out" --project-name vexor-cnc --branch main --commit-hash "$GITHUB_SHA"
